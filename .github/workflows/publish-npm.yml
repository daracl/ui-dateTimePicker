name: Publish to npm

on:
  push:
    branches: [main]
  # 배포가 실패했을 때 버전을 올리지 않고 다시 실행하기 위한 수동 실행. main 브랜치에서만 배포한다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Compare package versions with the previous commit
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, readFileSync } = require('node:fs');
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            console.log('Manual run; publishing the version in package.json.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
            process.exit(0);
          }
          const parents = execFileSync('git', ['rev-list', '--parents', '-n', '1', 'HEAD'], { encoding: 'utf8' }).trim().split(/\s+/);
          if (parents.length === 1) {
            console.log('No previous commit; skipping publication.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
          } else {
            const previous = JSON.parse(execFileSync('git', ['show', 'HEAD^:package.json'], { encoding: 'utf8' })).version;
            if (typeof current !== 'string' || typeof previous !== 'string') {
              throw new Error('package.json must contain a version string.');
            }
            const changed = current !== previous;
            console.log(`Version: ${previous} -> ${current}; ${changed ? 'publish' : 'skip'}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          }
          NODE

  publish:
    needs: version
    if: needs.version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # registry-url 을 지정하지 않는다. 지정하면 setup-node 가 .npmrc 에 _authToken=${NODE_AUTH_TOKEN} 줄을 만들어
          # 토큰이 없는 OIDC(Trusted Publishing) 인증을 막고 E404 / ENEEDAUTH 로 실패할 수 있다.
          node-version: '24'
      - name: Set up npm
        # Trusted Publishing(OIDC)은 npm 11.5.1 이상이 필요하다.
        run: |
          npm install --global npm@11
          node --version
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))throw new Error('npm '+process.argv[1]+' is older than 11.5.1 (required for OIDC)')" "$(npm --version)"
      - name: Verify no npm token is configured
        # OIDC 는 토큰이 없어야 동작한다. 남아 있는 토큰 설정이 있으면 원인 파악을 위해 실패시킨다.
        run: |
          # npm 11 은 config get 으로 토큰을 읽지 못하므로 .npmrc 파일을 직접 확인한다.
          fail=0
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then echo 'NODE_AUTH_TOKEN is set.' >&2; fail=1; fi
          for f in "$(npm config get userconfig)" "$(npm config get globalconfig)" "${NPM_CONFIG_USERCONFIG:-}" .npmrc; do
            if [ -n "$f" ] && [ -f "$f" ] && grep -q '_authToken' "$f"; then echo "_authToken found in $f" >&2; fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo 'An npm auth token is configured; it prevents Trusted Publishing (OIDC).' >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        # tests/browser.test.mjs 와 tests/range.test.mjs 가 크로미움을 사용한다.
        run: npx playwright install --with-deps chromium
      - name: Test and build
        # npm test: 전체 빌드 -> node --test -> test:types -> test:package
        run: npm test
      - name: Publish with Trusted Publishing
        # OIDC 로 인증하므로 NODE_AUTH_TOKEN 이 필요 없다. prepack 의 중복 빌드는 생략한다.
        run: npm publish --access public --ignore-scripts
